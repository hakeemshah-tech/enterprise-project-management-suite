name: Enterprise Build

# Internal CI gate for the Enterprise Project Management Suite.
#
# ACTIVE SCOPE: static analysis only (Prettier + ESLint across both workspaces).
# The integration and production-image stages are present but disabled; see the
# note above each one. Every check that runs here has been verified locally and
# is expected to pass.

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: enterprise-build-${{ github.ref }}
  cancel-in-progress: true

# Disabled together with the integration stage: COMPOSE_FILE and
# COMPOSE_PROJECT_NAME exist solely for the Compose-based jobs below. Restore
# this block when re-enabling them.
#
# env:
#   COMPOSE_FILE: docker-compose.dev.yml
#   COMPOSE_PROJECT_NAME: epms-ci-${{ github.run_id }}

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Static analysis. Fails fast before any containers are built.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        # Backend ESLint resolves generated Prisma types, so this must run first.
        run: npm run prisma:generate --workspace=backend

      - name: Prettier
        # Root script fans out to every workspace that defines format:check,
        # so the frontend is gated as strictly as the backend.
        run: npm run format:check

      - name: ESLint
        # lint:check is the non-mutating variant in every workspace. The
        # backend's `lint` script runs `eslint --fix`, which rewrites files and
        # exits 0, so a gate built on it would report success instead of the
        # problems. This is the same script .husky/pre-commit runs.
        run: npm run lint:check

